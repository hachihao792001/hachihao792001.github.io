<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept: GJK step by step</title>
    <style>
        :root { --ink: #17384a; --muted: #5b7183; --line: #c6d4de; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 12px; background: #f7f9fb; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        canvas { background: #fff; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; height: auto; touch-action: none; cursor: grab; }
        canvas.dragging { cursor: grabbing; }
        .readout { font-size: 13px; line-height: 1.6; text-align: center; max-width: 540px; min-height: 64px; }
        .hint { font-size: 11.5px; color: var(--muted); }
        button { font-family: inherit; font-size: 13px; padding: 4px 14px; }
    </style>
</head>

<body>
    <canvas id="c" width="540" height="290"></canvas>
    <div><button id="next">Bước tiếp</button> <button id="restart">Làm lại</button></div>
    <div class="readout" id="out"></div>
    <div class="hint">Kéo hình vuông B ở khung trái rồi bấm Bước tiếp. Khung phải: A − B (mờ, GJK không hề tính hình này, chỉ vẽ ra cho bạn xem), simplex (xanh lá), hướng d (xanh dương).</div>

    <script>
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const out = document.getElementById("out");
        const SCALE = 42;
        const LEFT = { x: 135, y: 145 };
        const RIGHT = { x: 405, y: 145 };

        const shapeA = [{ x: -0.2, y: -1.2 }, { x: 1.3, y: -0.6 }, { x: 1.1, y: 0.9 }, { x: -0.4, y: 1.3 }, { x: -1.3, y: 0.1 }];
        const squareB = [{ x: -0.6, y: -0.6 }, { x: 0.6, y: -0.6 }, { x: 0.6, y: 0.6 }, { x: -0.6, y: 0.6 }];
        const positionB = { x: 1.2, y: 0.8 };

        const toScreen = (origin, v) => ({ x: origin.x + v.x * SCALE, y: origin.y - v.y * SCALE });
        const shapeB = () => squareB.map(v => ({ x: v.x + positionB.x, y: v.y + positionB.y }));
        const dot = (a, b) => a.x * b.x + a.y * b.y;
        const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
        const neg = a => ({ x: -a.x, y: -a.y });
        const name = i => ["a", "b", "c"][i];

        function farthest(points, d) {
            let best = points[0];
            for (const p of points) if (dot(p, d) > dot(best, d)) best = p;
            return best;
        }
        const support = d => sub(farthest(shapeA, d), farthest(shapeB(), neg(d)));

        // perpendicular of ab that points toward the origin side given by "toward"
        function perpendicularToward(ab, toward) {
            let p = { x: -ab.y, y: ab.x };
            if (dot(p, toward) < 0) p = neg(p);
            return p;
        }

        // run GJK once and record a snapshot after every move, so the buttons can replay it
        function runGjk() {
            const steps = [];
            const centerA = { x: 0, y: 0 };
            let d = sub(positionB, centerA);
            let simplex = [support(d)];
            steps.push({ simplex: simplex.slice(), d: d, highlight: 0, text: "Bước đầu: lấy support theo một hướng bất kỳ (ở đây là hướng từ tâm A sang tâm B). Điểm này nằm trên biên của A − B." });
            d = neg(simplex[0]);
            steps.push({ simplex: simplex.slice(), d: d, text: "Muốn bao được gốc tọa độ thì phải đi về phía gốc: hướng mới d = gốc − điểm vừa có." });

            for (let iteration = 0; iteration < 20; iteration++) {
                const p = support(d);
                if (dot(p, d) <= 0) {
                    steps.push({ simplex: simplex.slice(), d: d, extra: p, done: "miss", text: "Điểm xa nhất theo hướng d mà vẫn chưa vượt qua gốc (tích vô hướng với d ≤ 0): cả hình A − B nằm bên kia gốc. <b>Không chạm nhau.</b>" });
                    return steps;
                }
                simplex.unshift(p);
                steps.push({ simplex: simplex.slice(), d: d, highlight: 0, text: "Lấy support theo hướng d, điểm mới vượt qua gốc (tích vô hướng với d > 0) nên còn hy vọng, thêm nó vào simplex." });

                if (simplex.length == 2) {
                    const [a, b] = simplex;
                    const ab = sub(b, a), ao = neg(a);
                    d = perpendicularToward(ab, ao);
                    steps.push({ simplex: simplex.slice(), d: d, text: "Simplex là đoạn thẳng. Gốc nằm về một bên của đoạn này, hướng mới là hướng vuông góc với đoạn, chỉ về phía gốc." });
                } else {
                    const [a, b, c] = simplex;
                    const ab = sub(b, a), ac = sub(c, a), ao = neg(a);
                    const abOut = perpendicularToward(ab, neg(ac));
                    const acOut = perpendicularToward(ac, neg(ab));
                    if (dot(abOut, ao) > 0) {
                        simplex = [a, b];
                        d = abOut;
                        steps.push({ simplex: simplex.slice(), d: d, text: "Simplex là tam giác, gốc nằm ngoài cạnh ab: bỏ đỉnh c (đỉnh xa gốc nhất, vô dụng), đi tiếp vuông góc với ab về phía gốc." });
                    } else if (dot(acOut, ao) > 0) {
                        simplex = [a, c];
                        d = acOut;
                        steps.push({ simplex: simplex.slice(), d: d, text: "Simplex là tam giác, gốc nằm ngoài cạnh ac: bỏ đỉnh b, đi tiếp vuông góc với ac về phía gốc." });
                    } else {
                        steps.push({ simplex: simplex.slice(), d: null, done: "hit", text: "Gốc không nằm ngoài cạnh ab, cũng không ngoài ac (cạnh bc thì đã kiểm tra ở bước trước), vậy gốc nằm trong tam giác. <b>A và B chồng lên nhau.</b>" });
                        return steps;
                    }
                }
            }
            return steps;
        }

        let steps = runGjk();
        let stepIndex = 0;

        function convexHull(points) {
            const p = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
            const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
            const lower = [], upper = [];
            for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
            for (const q of p.slice().reverse()) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
            return lower.slice(0, -1).concat(upper.slice(0, -1));
        }

        function polygon(origin, points, fill, stroke, width = 2) {
            ctx.beginPath();
            points.forEach((v, i) => { const s = toScreen(origin, v); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke();
        }

        function arrow(from, to, color) {
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
            const ang = Math.atan2(to.y - from.y, to.x - from.x);
            ctx.beginPath(); ctx.moveTo(to.x, to.y);
            ctx.lineTo(to.x - 10 * Math.cos(ang - 0.4), to.y - 10 * Math.sin(ang - 0.4));
            ctx.lineTo(to.x - 10 * Math.cos(ang + 0.4), to.y - 10 * Math.sin(ang + 0.4));
            ctx.closePath(); ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#e3eaf0"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(270, 10); ctx.lineTo(270, 280); ctx.stroke();
            polygon(LEFT, shapeA, "rgba(108,141,181,0.25)", "#6c8db5");
            polygon(LEFT, shapeB(), "rgba(199,125,42,0.25)", "#c77d2a");
            ctx.fillStyle = "#17384a"; ctx.font = "600 13px ui-monospace, Consolas, monospace";
            const la = toScreen(LEFT, { x: 0, y: 0 }); ctx.fillText("A", la.x - 4, la.y + 4);
            const lb = toScreen(LEFT, positionB); ctx.fillText("B", lb.x - 4, lb.y + 4);

            ctx.strokeStyle = "#e3eaf0"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(275, RIGHT.y); ctx.lineTo(535, RIGHT.y); ctx.moveTo(RIGHT.x, 10); ctx.lineTo(RIGHT.x, 280); ctx.stroke();
            const diff = [];
            for (const a of shapeA) for (const b of shapeB()) diff.push(sub(a, b));
            polygon(RIGHT, convexHull(diff), "rgba(150,160,170,0.12)", "#c3cbd2", 1.5);

            const step = steps[stepIndex];
            if (step.simplex.length >= 2) polygon(RIGHT, step.simplex, step.done == "hit" ? "rgba(42,143,92,0.25)" : null, "#2a8f5c", 2.5);
            step.simplex.forEach((p, i) => {
                const s = toScreen(RIGHT, p);
                ctx.beginPath(); ctx.arc(s.x, s.y, step.highlight === i ? 7 : 5, 0, Math.PI * 2);
                ctx.fillStyle = step.highlight === i ? "#f2c40f" : "#2a8f5c"; ctx.fill();
                ctx.fillStyle = "#17384a"; ctx.font = "600 12px ui-monospace, Consolas, monospace";
                ctx.fillText(name(i), s.x + 8, s.y - 6);
            });
            if (step.extra) {
                const s = toScreen(RIGHT, step.extra);
                ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fillStyle = "#c2473f"; ctx.fill();
            }
            const o = toScreen(RIGHT, { x: 0, y: 0 });
            if (step.d) {
                const len = Math.hypot(step.d.x, step.d.y) || 1;
                arrow(o, { x: o.x + step.d.x / len * 55, y: o.y - step.d.y / len * 55 }, "#20799b");
                ctx.fillStyle = "#20799b"; ctx.fillText("d", o.x + step.d.x / len * 62, o.y - step.d.y / len * 62);
            }
            ctx.strokeStyle = "#17384a"; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(o.x - 6, o.y - 6); ctx.lineTo(o.x + 6, o.y + 6); ctx.moveTo(o.x + 6, o.y - 6); ctx.lineTo(o.x - 6, o.y + 6); ctx.stroke();
        }

        function say() {
            out.innerHTML = `<b>Bước ${stepIndex + 1} / ${steps.length}</b><br/>${steps[stepIndex].text}`;
        }

        function render() { draw(); say(); }

        document.getElementById("next").addEventListener("click", () => { if (stepIndex < steps.length - 1) stepIndex++; render(); });
        document.getElementById("restart").addEventListener("click", () => { stepIndex = 0; render(); });

        let dragging = false, grabOffset = null;
        function at(e) {
            const r = canvas.getBoundingClientRect();
            return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
        }
        canvas.addEventListener("pointerdown", e => {
            const p = at(e), s = toScreen(LEFT, positionB);
            if (Math.abs(p.x - s.x) > 0.6 * SCALE + 10 || Math.abs(p.y - s.y) > 0.6 * SCALE + 10) return;
            dragging = true; grabOffset = { x: p.x - s.x, y: p.y - s.y }; canvas.classList.add("dragging");
            try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
        });
        canvas.addEventListener("pointermove", e => {
            if (!dragging) return;
            const p = at(e);
            positionB.x = Math.max(-2.4, Math.min(2.4, (p.x - grabOffset.x - LEFT.x) / SCALE));
            positionB.y = Math.max(-2.8, Math.min(2.8, (LEFT.y - (p.y - grabOffset.y)) / SCALE));
            steps = runGjk();
            stepIndex = 0;
            render();
        });
        const release = () => { dragging = false; canvas.classList.remove("dragging"); };
        canvas.addEventListener("pointerup", release);
        canvas.addEventListener("pointercancel", release);

        render();

        (function selfTest() {
            const saved = { ...positionB };
            positionB.x = 0.2; positionB.y = 0.1;
            const hit = runGjk().at(-1).done;
            positionB.x = 2.4; positionB.y = 2.6;
            const miss = runGjk().at(-1).done;
            Object.assign(positionB, saved);
            steps = runGjk();
            if (hit !== "hit" || miss !== "miss") console.error("gjk self-test failed", hit, miss);
        })();
    </script>
</body>

</html>
