<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept: support function</title>
    <style>
        :root { --ink: #17384a; --muted: #5b7183; --line: #c6d4de; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 12px; background: #f7f9fb; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        canvas { background: #fff; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; height: auto; touch-action: none; cursor: grab; }
        canvas.dragging { cursor: grabbing; }
        .readout { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.6; text-align: center; }
        .hint { font-size: 11.5px; color: var(--muted); }
    </style>
</head>

<body>
    <canvas id="c" width="460" height="280"></canvas>
    <div class="readout" id="out"></div>
    <div class="hint">Kéo đầu mũi tên xanh để đổi hướng d. Điểm vàng là support(d): đỉnh có tích vô hướng với d lớn nhất.</div>

    <script>
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const out = document.getElementById("out");
        const O = { x: 230, y: 140 };
        const SCALE = 70;

        const shape = [
            { x: 1.3, y: 0.2 }, { x: 0.6, y: 1.2 }, { x: -0.5, y: 1.0 },
            { x: -1.4, y: 0.1 }, { x: -0.8, y: -1.0 }, { x: 0.7, y: -1.1 },
        ];
        const direction = { x: 1.6, y: 1.0 };

        const toScreen = v => ({ x: O.x + v.x * SCALE, y: O.y - v.y * SCALE });
        const toMath = p => ({ x: (p.x - O.x) / SCALE, y: (O.y - p.y) / SCALE });
        const dot = (a, b) => a.x * b.x + a.y * b.y;

        function support(d) {
            let best = 0;
            for (let i = 1; i < shape.length; i++) if (dot(shape[i], d) > dot(shape[best], d)) best = i;
            return best;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            shape.forEach((v, i) => { const s = toScreen(v); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
            ctx.closePath();
            ctx.fillStyle = "#e8eef8";
            ctx.fill();
            ctx.strokeStyle = "#6c8db5";
            ctx.lineWidth = 2;
            ctx.stroke();

            const best = support(direction);
            const len = Math.hypot(direction.x, direction.y);
            if (len > 1e-6) {
                // the line perpendicular to d through the support point: nothing of the shape is beyond it
                const d = { x: direction.x / len, y: direction.y / len };
                const p = shape[best];
                const a = toScreen({ x: p.x - d.y * 4, y: p.y + d.x * 4 });
                const b = toScreen({ x: p.x + d.y * 4, y: p.y - d.x * 4 });
                ctx.strokeStyle = "#e0b020";
                ctx.setLineDash([5, 4]);
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                ctx.setLineDash([]);
            }

            // direction arrow from the origin
            const tip = toScreen(direction);
            ctx.strokeStyle = "#20799b"; ctx.fillStyle = "#20799b"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(O.x, O.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
            const ang = Math.atan2(tip.y - O.y, tip.x - O.x);
            ctx.beginPath();
            ctx.moveTo(tip.x, tip.y);
            ctx.lineTo(tip.x - 12 * Math.cos(ang - 0.4), tip.y - 12 * Math.sin(ang - 0.4));
            ctx.lineTo(tip.x - 12 * Math.cos(ang + 0.4), tip.y - 12 * Math.sin(ang + 0.4));
            ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.arc(tip.x, tip.y, 7, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#20799b"; ctx.font = "600 13px ui-monospace, Consolas, monospace"; ctx.fillText("d", tip.x + 10, tip.y - 8);

            shape.forEach((v, i) => {
                const s = toScreen(v);
                ctx.beginPath(); ctx.arc(s.x, s.y, i == best ? 7 : 4, 0, Math.PI * 2);
                ctx.fillStyle = i == best ? "#f2c40f" : "#6c8db5"; ctx.fill();
                if (i == best) { ctx.strokeStyle = "#8a6d00"; ctx.lineWidth = 1.5; ctx.stroke(); }
                ctx.fillStyle = "#17384a"; ctx.font = "12px ui-monospace, Consolas, monospace";
                ctx.fillText(String.fromCharCode(65 + i), s.x + 8, s.y + 14);
            });
        }

        function say() {
            const best = support(direction);
            const parts = shape.map((v, i) => {
                const text = `${String.fromCharCode(65 + i)}·d = ${dot(v, direction).toFixed(2)}`;
                return i == best ? `<b style="background:#fbe9a6">${text}</b>` : text;
            });
            out.innerHTML = `d = (${direction.x.toFixed(2)}, ${direction.y.toFixed(2)})<br/>` + parts.slice(0, 3).join(" &nbsp; ") + "<br/>" + parts.slice(3).join(" &nbsp; ") +
                `<br/>support(d) = ${String.fromCharCode(65 + best)}`;
        }

        function render() { draw(); say(); }

        let dragging = false;
        function at(e) {
            const r = canvas.getBoundingClientRect();
            return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
        }
        canvas.addEventListener("pointerdown", e => {
            const p = at(e), s = toScreen(direction);
            if (Math.hypot(s.x - p.x, s.y - p.y) > 30) return;
            dragging = true; canvas.classList.add("dragging");
            try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
        });
        canvas.addEventListener("pointermove", e => {
            if (!dragging) return;
            const m = toMath(at(e));
            direction.x = m.x; direction.y = m.y;
            render();
        });
        const release = () => { dragging = false; canvas.classList.remove("dragging"); };
        canvas.addEventListener("pointerup", release);
        canvas.addEventListener("pointercancel", release);

        render();

        (function selfTest() {
            // straight right: A (x = 1.3) is the farthest; straight down: F (y = -1.1)
            if (support({ x: 1, y: 0 }) !== 0 || support({ x: 0, y: -1 }) !== 5) console.error("support self-test failed");
        })();
    </script>
</body>

</html>
