<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept: EPA step by step</title>
    <style>
        :root { --ink: #17384a; --muted: #5b7183; --line: #c6d4de; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 12px; background: #f7f9fb; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        canvas { background: #fff; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; height: auto; touch-action: none; cursor: grab; }
        canvas.dragging { cursor: grabbing; }
        .readout { font-size: 13px; line-height: 1.6; text-align: center; max-width: 540px; min-height: 64px; }
        .hint { font-size: 11.5px; color: var(--muted); }
        button { font-family: inherit; font-size: 13px; padding: 4px 14px; }
    </style>
</head>

<body>
    <canvas id="c" width="540" height="290"></canvas>
    <div><button id="next">Bước tiếp</button> <button id="restart">Làm lại</button></div>
    <div class="readout" id="out"></div>
    <div class="hint">Kéo hình vuông B (phải chồng lên A thì EPA mới có việc làm) rồi bấm Bước tiếp. Khung phải: đa giác EPA đang nở ra (xanh lá), cạnh gần gốc nhất (đỏ).</div>

    <script>
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const out = document.getElementById("out");
        const SCALE = 42;
        const LEFT = { x: 135, y: 145 };
        const RIGHT = { x: 405, y: 145 };

        const shapeA = [{ x: -0.2, y: -1.2 }, { x: 1.3, y: -0.6 }, { x: 1.1, y: 0.9 }, { x: -0.4, y: 1.3 }, { x: -1.3, y: 0.1 }];
        const squareB = [{ x: -0.6, y: -0.6 }, { x: 0.6, y: -0.6 }, { x: 0.6, y: 0.6 }, { x: -0.6, y: 0.6 }];
        const positionB = { x: 0.9, y: 0.5 };

        const toScreen = (origin, v) => ({ x: origin.x + v.x * SCALE, y: origin.y - v.y * SCALE });
        const shapeB = (offset = { x: 0, y: 0 }) => squareB.map(v => ({ x: v.x + positionB.x + offset.x, y: v.y + positionB.y + offset.y }));
        const dot = (a, b) => a.x * b.x + a.y * b.y;
        const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
        const neg = a => ({ x: -a.x, y: -a.y });

        function farthest(points, d) {
            let best = points[0];
            for (const p of points) if (dot(p, d) > dot(best, d)) best = p;
            return best;
        }
        const support = d => sub(farthest(shapeA, d), farthest(shapeB(), neg(d)));

        // GJK only to get the starting triangle
        function gjkTriangle() {
            const perpendicularToward = (ab, toward) => { let p = { x: -ab.y, y: ab.x }; return dot(p, toward) < 0 ? neg(p) : p; };
            let d = positionB;
            let simplex = [support(d)];
            d = neg(simplex[0]);
            for (let i = 0; i < 20; i++) {
                const p = support(d);
                if (dot(p, d) <= 0) return null;
                simplex.unshift(p);
                if (simplex.length == 2) {
                    d = perpendicularToward(sub(simplex[1], simplex[0]), neg(simplex[0]));
                } else {
                    const [a, b, c] = simplex;
                    const ab = sub(b, a), ac = sub(c, a), ao = neg(a);
                    const abOut = perpendicularToward(ab, neg(ac)), acOut = perpendicularToward(ac, neg(ab));
                    if (dot(abOut, ao) > 0) { simplex = [a, b]; d = abOut; }
                    else if (dot(acOut, ao) > 0) { simplex = [a, c]; d = acOut; }
                    else return simplex;
                }
            }
            return null;
        }

        // the polygon is kept in counter-clockwise order so every edge's outward normal is (dy, -dx)
        function closestEdge(polygon) {
            let best = null;
            for (let i = 0; i < polygon.length; i++) {
                const a = polygon[i], b = polygon[(i + 1) % polygon.length];
                const e = sub(b, a);
                const len = Math.hypot(e.x, e.y);
                const normal = { x: e.y / len, y: -e.x / len };
                const distance = dot(normal, a);
                if (!best || distance < best.distance) best = { index: i, normal, distance };
            }
            return best;
        }

        function runEpa() {
            let triangle = gjkTriangle();
            if (!triangle) return [{ polygon: [], text: "A và B không chồng lên nhau, GJK đã trả lời rồi, EPA không có gì để làm. Kéo B vào trong A." }];
            const area = (triangle[1].x - triangle[0].x) * (triangle[2].y - triangle[0].y) - (triangle[1].y - triangle[0].y) * (triangle[2].x - triangle[0].x);
            let polygon = area > 0 ? triangle.slice() : [triangle[0], triangle[2], triangle[1]];
            const steps = [{ polygon: polygon.slice(), text: "Bắt đầu từ tam giác mà GJK trả về, nó chứa gốc tọa độ. Mọi đỉnh của nó đều nằm trên biên của A − B." }];
            for (let iteration = 0; iteration < 30; iteration++) {
                const edge = closestEdge(polygon);
                steps.push({ polygon: polygon.slice(), edge, text: `Tìm cạnh gần gốc nhất của đa giác (đỏ), cách gốc ${edge.distance.toFixed(3)}. Nếu cạnh này nằm đúng trên biên của A − B thì đó là đáp án.` });
                const p = support(edge.normal);
                const pDistance = dot(p, edge.normal);
                if (pDistance - edge.distance < 1e-4) {
                    steps.push({ polygon: polygon.slice(), edge, newPoint: p, done: true, text: `Support theo pháp tuyến của cạnh đỏ không đi xa hơn cạnh đó (${pDistance.toFixed(3)}): cạnh đỏ chính là biên của A − B. <b>Độ lún = ${edge.distance.toFixed(3)}</b>, pháp tuyến = mũi tên đỏ. Đẩy B theo mũi tên một đoạn bằng độ lún thì 2 hình vừa chạm (hình vuông nét đứt).` });
                    return steps;
                }
                steps.push({ polygon: polygon.slice(), edge, newPoint: p, text: `Support theo pháp tuyến của cạnh đỏ đi xa hơn cạnh đó (${pDistance.toFixed(3)} > ${edge.distance.toFixed(3)}): cạnh đỏ nằm bên trong A − B, chưa phải biên. Lấy điểm mới (vàng)...` });
                polygon.splice(edge.index + 1, 0, p);
                steps.push({ polygon: polygon.slice(), text: "...và chèn nó vào giữa 2 đầu của cạnh đỏ: cạnh đỏ bị thay bằng 2 cạnh mới. Đa giác nở ra sát biên A − B hơn." });
            }
            return steps;
        }

        let steps = runEpa();
        let stepIndex = 0;

        function convexHull(points) {
            const p = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
            const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
            const lower = [], upper = [];
            for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
            for (const q of p.slice().reverse()) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
            return lower.slice(0, -1).concat(upper.slice(0, -1));
        }

        function polygonPath(origin, points, fill, stroke, width = 2, dash = []) {
            if (points.length == 0) return;
            ctx.setLineDash(dash);
            ctx.beginPath();
            points.forEach((v, i) => { const s = toScreen(origin, v); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#e3eaf0"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(270, 10); ctx.lineTo(270, 280); ctx.stroke();
            const step = steps[stepIndex];

            polygonPath(LEFT, shapeA, "rgba(108,141,181,0.25)", "#6c8db5");
            polygonPath(LEFT, shapeB(), "rgba(199,125,42,0.25)", "#c77d2a");
            if (step.done) {
                const push = { x: step.edge.normal.x * step.edge.distance, y: step.edge.normal.y * step.edge.distance };
                polygonPath(LEFT, shapeB(push), null, "#c2473f", 1.5, [5, 4]);
            }

            ctx.strokeStyle = "#e3eaf0"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(275, RIGHT.y); ctx.lineTo(535, RIGHT.y); ctx.moveTo(RIGHT.x, 10); ctx.lineTo(RIGHT.x, 280); ctx.stroke();
            const diff = [];
            for (const a of shapeA) for (const b of shapeB()) diff.push(sub(a, b));
            polygonPath(RIGHT, convexHull(diff), "rgba(150,160,170,0.12)", "#c3cbd2", 1.5);
            polygonPath(RIGHT, step.polygon, "rgba(42,143,92,0.15)", "#2a8f5c", 2);
            for (const p of step.polygon) {
                const s = toScreen(RIGHT, p);
                ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fillStyle = "#2a8f5c"; ctx.fill();
            }
            const o = toScreen(RIGHT, { x: 0, y: 0 });
            if (step.edge) {
                const a = toScreen(RIGHT, step.polygon[step.edge.index]);
                const b = toScreen(RIGHT, step.polygon[(step.edge.index + 1) % step.polygon.length]);
                ctx.strokeStyle = "#c2473f"; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                const foot = toScreen(RIGHT, { x: step.edge.normal.x * step.edge.distance, y: step.edge.normal.y * step.edge.distance });
                ctx.strokeStyle = "#c2473f"; ctx.fillStyle = "#c2473f"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(foot.x, foot.y); ctx.stroke();
                const ang = Math.atan2(foot.y - o.y, foot.x - o.x);
                ctx.beginPath(); ctx.moveTo(foot.x, foot.y);
                ctx.lineTo(foot.x - 9 * Math.cos(ang - 0.4), foot.y - 9 * Math.sin(ang - 0.4));
                ctx.lineTo(foot.x - 9 * Math.cos(ang + 0.4), foot.y - 9 * Math.sin(ang + 0.4));
                ctx.closePath(); ctx.fill();
            }
            if (step.newPoint) {
                const s = toScreen(RIGHT, step.newPoint);
                ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fillStyle = "#f2c40f"; ctx.fill();
            }
            ctx.strokeStyle = "#17384a"; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(o.x - 6, o.y - 6); ctx.lineTo(o.x + 6, o.y + 6); ctx.moveTo(o.x + 6, o.y - 6); ctx.lineTo(o.x - 6, o.y + 6); ctx.stroke();
        }

        function say() { out.innerHTML = `<b>Bước ${stepIndex + 1} / ${steps.length}</b><br/>${steps[stepIndex].text}`; }
        function render() { draw(); say(); }

        document.getElementById("next").addEventListener("click", () => { if (stepIndex < steps.length - 1) stepIndex++; render(); });
        document.getElementById("restart").addEventListener("click", () => { stepIndex = 0; render(); });

        let dragging = false, grabOffset = null;
        function at(e) {
            const r = canvas.getBoundingClientRect();
            return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
        }
        canvas.addEventListener("pointerdown", e => {
            const p = at(e), s = toScreen(LEFT, positionB);
            if (Math.abs(p.x - s.x) > 0.6 * SCALE + 10 || Math.abs(p.y - s.y) > 0.6 * SCALE + 10) return;
            dragging = true; grabOffset = { x: p.x - s.x, y: p.y - s.y }; canvas.classList.add("dragging");
            try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
        });
        canvas.addEventListener("pointermove", e => {
            if (!dragging) return;
            const p = at(e);
            positionB.x = Math.max(-2.4, Math.min(2.4, (p.x - grabOffset.x - LEFT.x) / SCALE));
            positionB.y = Math.max(-2.8, Math.min(2.8, (LEFT.y - (p.y - grabOffset.y)) / SCALE));
            steps = runEpa();
            stepIndex = 0;
            render();
        });
        const release = () => { dragging = false; canvas.classList.remove("dragging"); };
        canvas.addEventListener("pointerup", release);
        canvas.addEventListener("pointercancel", release);

        render();

        (function selfTest() {
            // B centred at (0, 1.8): pushed straight up out of A, its bottom must clear A's top vertex (y = 1.3), so the depth is 1.3 - (1.8 - 0.6) = 0.1
            const saved = { ...positionB };
            positionB.x = -0.4; positionB.y = 1.8;
            const last = runEpa().at(-1);
            Object.assign(positionB, saved);
            steps = runEpa();
            if (!last.done || Math.abs(last.edge.distance - 0.1) > 1e-3) console.error("epa self-test failed", last);
        })();
    </script>
</body>

</html>
