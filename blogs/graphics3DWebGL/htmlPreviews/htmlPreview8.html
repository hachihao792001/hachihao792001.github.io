<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>3D Engine</title>
</head>

<body style="text-align: center; background: #f0f0f0">
	<h1>3D Engine</h1>
	<canvas id="gameCanvas" width="400" height="300" style="border: 2px solid #aaa; background: #fff"></canvas>
	<script>
		class Vector3 {
			constructor(x = 0, y = 0, z = 0, w = 1) {
				this.x = x;
				this.y = y;
				this.z = z;
				this.w = w;
			}

			clone() {
				return new Vector3(this.x, this.y, this.z, this.w);
			}

			static add(vec1, vec2) {
				return new Vector3(vec1.x + vec2.x, vec1.y + vec2.y, vec1.z + vec2.z);
			}
			static sub(vec1, vec2) {
				return new Vector3(vec1.x - vec2.x, vec1.y - vec2.y, vec1.z - vec2.z);
			}
			static mul(vec, value) {
				return new Vector3(vec.x * value, vec.y * value, vec.z * value);
			}
			static div(vec, value) {
				return new Vector3(vec.x / value, vec.y / value, vec.z / value);
			}
			static scale(vec1, vec2) {
				return new Vector3(vec1.x * vec2.x, vec1.y * vec2.y, vec1.z * vec2.z);
			}
			static dot(v1, v2) {
				return v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
			}
			static cross(v1, v2) {
				let v = new Vector3(
					v1.y * v2.z - v1.z * v2.y,
					v1.z * v2.x - v1.x * v2.z,
					v1.x * v2.y - v1.y * v2.x);
				return v;
			}
			magnitude() {
				return Math.hypot(this.x, this.y, this.z);
			}
			normalize() {
				let length = this.magnitude();
				if (length === 0)
					return this;
				this.x /= length;
				this.y /= length;
				this.z /= length;
				return this;
			}
		}
		class Quaternion {
			constructor(a = 1, b = 0, c = 0, d = 0) {
				this.a = a;
				this.b = b;
				this.c = c;
				this.d = d;
			}

			static buildQuaternionAxisAngle(axis, angle) {
				let radian = angle / 180.0 * Math.PI;
				const half = radian / 2;
				const s = -Math.sin(half);
				return new Quaternion(
					Math.cos(half),
					axis.x * s,
					axis.y * s,
					axis.z * s);
			}

			static buildQuaternionEuler(eulerAngles) {
				const a = eulerAngles.x / 180 * Math.PI * 0.5;
				const b = eulerAngles.y / 180 * Math.PI * 0.5;
				const c = eulerAngles.z / 180 * Math.PI * 0.5;

				const cosA = Math.cos(a);
				const sinA = Math.sin(a);
				const cosB = Math.cos(b);
				const sinB = Math.sin(b);
				const cosC = Math.cos(c);
				const sinC = Math.sin(c);

				return new Quaternion(
					cosC * cosB * cosA - sinC * sinB * sinA,
					-cosC * cosB * sinA - sinC * sinB * cosA,
					-cosC * sinB * cosA + sinC * cosB * sinA,
					-sinC * cosB * cosA - cosC * sinB * sinA
				);
			}

			static multiply(p, q) {
				let a = p.a * q.a - p.b * q.b - p.c * q.c - p.d * q.d;
				let b = p.a * q.b + p.b * q.a + p.c * q.d - p.d * q.c;
				let c = p.a * q.c - p.b * q.d + p.c * q.a + p.d * q.b;
				let d = p.a * q.d + p.b * q.c - p.c * q.b + p.d * q.a;
				return new Quaternion(a, b, c, d);
			}

			conjugate() {
				return new Quaternion(this.a, -this.b, -this.c, -this.d);
			}

			rotateVector(v) {
				const qVec = new Quaternion(0, v.x, v.y, v.z);
				const res = Quaternion.multiply(Quaternion.multiply(this, qVec), this.conjugate());
				return new Vector3(
					res.b,
					res.c,
					res.d);
			}
		}

		let gameCanvas = document.getElementById("gameCanvas");
		let gl = gameCanvas.getContext("webgl2");

		gl.enable(gl.DEPTH_TEST);
		gl.depthFunc(gl.LESS);

		gl.clearColor(0.9, 0.9, 0.9, 1);
		gl.clearDepth(1);
		gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

		const vertexShaderSource = `#version 300 es
in vec3 aPosition;
in vec3 aColor;
uniform float uZNear;
uniform float uZFar;
uniform float uAspect;
out vec4 vColor;

void main(){
	float a = (uZFar + uZNear) / (uZFar - uZNear);
	float b = -2.0 * uZFar * uZNear / (uZFar - uZNear);
	gl_Position = vec4(aPosition.x / uAspect, aPosition.y, aPosition.z * a + b, aPosition.z);

	vColor = vec4(aColor, 1.0);
}`;
		const fragmentShaderSource = `#version 300 es
precision highp float;

in vec4 vColor;
out vec4 outColor;

void main(){
	outColor = vColor;
}`;
		function compileShader(type, source) {
			const shader = gl.createShader(type);
			gl.shaderSource(shader, source);
			gl.compileShader(shader);
			if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
				const log = gl.getShaderInfoLog(shader);
				gl.deleteShader(shader);
				throw new Error("Shader compile error: " + log);
			}
			return shader;
		}

		const program = gl.createProgram();
		gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexShaderSource));
		gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource));
		gl.linkProgram(program);
		if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
			throw new Error("Program link error: " + gl.getProgramInfoLog(program));
		}
		gl.useProgram(program);

		const uAspect = gl.getUniformLocation(program, "uAspect");
		const uZNear = gl.getUniformLocation(program, "uZNear");
		const uZFar = gl.getUniformLocation(program, "uZFar");
		gl.uniform1f(uAspect, gameCanvas.width / gameCanvas.height);
		gl.uniform1f(uZNear, 0.01);
		gl.uniform1f(uZFar, 1000);

		const corners = [
			new Vector3(-0.5, -0.5, -0.5),
			new Vector3(0.5, -0.5, -0.5),
			new Vector3(0.5, 0.5, -0.5),
			new Vector3(-0.5, 0.5, -0.5),
			new Vector3(-0.5, -0.5, 0.5),
			new Vector3(0.5, -0.5, 0.5),
			new Vector3(0.5, 0.5, 0.5),
			new Vector3(-0.5, 0.5, 0.5),
		];

		const triangles = new Uint16Array([
			0, 3, 2, 0, 2, 1,
			5, 6, 7, 5, 7, 4,
			4, 7, 3, 4, 3, 0,
			1, 2, 6, 1, 6, 5,
			3, 7, 6, 3, 6, 2,
			4, 0, 1, 4, 1, 5,
		]);

		let q = Quaternion.buildQuaternionEuler(new Vector3(40, 50, 30));
		let rotatedCorners = [];
		for (let i = 0; i < corners.length; i++) {
			rotatedCorners.push(q.rotateVector(corners[i]));
			rotatedCorners[i] = new Vector3(rotatedCorners[i].x, rotatedCorners[i].y, rotatedCorners[i].z + 2);
		}

		const vertexData = new Float32Array(corners.length * 6);
		for (let i = 0; i < corners.length; i++) {
			vertexData[i * 6] = rotatedCorners[i].x;
			vertexData[i * 6 + 1] = rotatedCorners[i].y;
			vertexData[i * 6 + 2] = rotatedCorners[i].z;
			vertexData[i * 6 + 3] = corners[i].x + 0.5;
			vertexData[i * 6 + 4] = corners[i].y + 0.5;
			vertexData[i * 6 + 5] = corners[i].z + 0.5;
		}

		const vertexBuffer = gl.createBuffer();
		gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
		gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
		const aPosition = gl.getAttribLocation(program, "aPosition");
		gl.enableVertexAttribArray(aPosition);
		gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 24, 0);
		const aColor = gl.getAttribLocation(program, "aColor");
		gl.enableVertexAttribArray(aColor);
		gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 24, 12);



		const elementBuffer = gl.createBuffer();
		gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, elementBuffer);
		gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, triangles, gl.STATIC_DRAW);

		gl.drawElements(gl.TRIANGLES, triangles.length, gl.UNSIGNED_SHORT, 0);

	</script>
</body>

</html>
