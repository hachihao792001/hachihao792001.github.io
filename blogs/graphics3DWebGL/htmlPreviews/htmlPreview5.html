<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>3D Engine</title>
</head>

<body style="text-align: center; background: #f0f0f0">
	<h1>3D Engine</h1>
	<canvas id="gameCanvas" width="400" height="300" style="border: 2px solid #aaa; background: #fff"></canvas>
	<script>
		let gameCanvas = document.getElementById("gameCanvas");
		let gl = gameCanvas.getContext("webgl2");

		gl.clearColor(0.9, 0.9, 0.9, 1);
		gl.clear(gl.COLOR_BUFFER_BIT);

		const vertexShaderSource = `#version 300 es
in vec3 aPosition;
in vec3 aColor;
out vec4 vColor;

void main(){
	gl_Position = vec4(aPosition, 1.0);
	vColor = vec4(aColor, 1.0);
}`;
		const fragmentShaderSource = `#version 300 es
precision highp float;

in vec4 vColor;
out vec4 outColor;

void main(){
	outColor = vColor;
}`;
		function compileShader(type, source) {
			const shader = gl.createShader(type);
			gl.shaderSource(shader, source);
			gl.compileShader(shader);
			if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
				const log = gl.getShaderInfoLog(shader);
				gl.deleteShader(shader);
				throw new Error("Shader compile error: " + log);
			}
			return shader;
		}

		const program = gl.createProgram();
		gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexShaderSource));
		gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource));
		gl.linkProgram(program);
		if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
			throw new Error("Program link error: " + gl.getProgramInfoLog(program));
		}
		gl.useProgram(program);

		const corners = [
			[-0.5, -0.5, -0.5],
			[0.5, -0.5, -0.5],
			[0.5, 0.5, -0.5],
			[-0.5, 0.5, -0.5],
			[-0.5, -0.5, 0.5],
			[0.5, -0.5, 0.5],
			[0.5, 0.5, 0.5],
			[-0.5, 0.5, 0.5],
		];

		const triangles = new Uint16Array([
			0, 3, 2, 0, 2, 1,
			5, 6, 7, 5, 7, 4,
			4, 7, 3, 4, 3, 0,
			1, 2, 6, 1, 6, 5,
			3, 7, 6, 3, 6, 2,
			4, 0, 1, 4, 1, 5,
		]);

		const vertexData = new Float32Array(corners.length * 6);
		for (let i = 0; i < corners.length; i++) {
			vertexData[i * 6] = corners[i][0];
			vertexData[i * 6 + 1] = corners[i][1];
			vertexData[i * 6 + 2] = corners[i][2];
			vertexData[i * 6 + 3] = corners[i][0] + 0.5;
			vertexData[i * 6 + 4] = corners[i][1] + 0.5;
			vertexData[i * 6 + 5] = corners[i][2] + 0.5;
		}

		const vertexBuffer = gl.createBuffer();
		gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
		gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
		const aPosition = gl.getAttribLocation(program, "aPosition");
		gl.enableVertexAttribArray(aPosition);
		gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 24, 0);
		const aColor = gl.getAttribLocation(program, "aColor");
		gl.enableVertexAttribArray(aColor);
		gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 24, 12);

		const elementBuffer = gl.createBuffer();
		gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, elementBuffer);
		gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, triangles, gl.STATIC_DRAW);

		gl.drawElements(gl.TRIANGLES, triangles.length, gl.UNSIGNED_SHORT, 0);

	</script>
</body>

</html>
